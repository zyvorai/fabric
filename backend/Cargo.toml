[workspace]
resolver = "2"
members = [
    "vmspawnd",
    "vmctl",
    "vmctl-tui",
    "vmspawn-driver",
    "vm-model",
    "state-store",
    "vnc-proxy",
    "cloud-init",
    "tpm-support",
    "prometheus-exporter",
    "networking",
    "crates/storage",
    "crates/system",
    "crates/vm",
    "datacenter",
    "host-agent",
    "resource-pools",
    "encryption",
    "predictive-drs",
    "distributed-storage",
    "fault-tolerance",
    "replication",

    "site-recovery",
    "content-library",
    "lifecycle-manager",
    "certificate-manager",
    "security",
    "crates/driver-core",
    "crates/machined-dbus",
    "crates/machinectl-driver",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["vmspawnd contributors"]

[workspace.dependencies]
tokio = { version = "1.44", features = ["full"] }
axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
tui-input = "0.11"
toml = "0.8"
futures = "0.3"
uuid = { version = "1.16", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.11"
tar = "0.4"
flate2 = "1.1"
hostname = "0.4"
rand = "0.9"
zbus = { version = "4", default-features = false, features = ["tokio"] }
async-stream = "0.3"
