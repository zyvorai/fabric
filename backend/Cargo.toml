[workspace]
resolver = "2"
members = [
    "enterprise-identity",
    "zyvor-fabricd",
    "zyvorctl",
    "vm-model",
    "state-store",
    "vnc-proxy",
    "cloud-init",
    "tpm-support",
    "prometheus-exporter",
    "networking",
    "crates/storage",
    "crates/system",
    "crates/vm",
    "datacenter",
    "host-agent",
    "host-lifecycle",
    "resource-pools",
    "encryption",
    "predictive-drs",
    "distributed-storage",
    "fault-tolerance",
    "replication",

    "site-recovery",
    "content-library",
    "lifecycle-manager",
    "certificate-manager",
    "security",
    "crates/driver-core",
    "crates/fluxvm-client",
    "crates/fluxvm-driver",
    "crates/dnsmasq-manager",
    "crates/lock-manager",
    "crates/cgroup",
    "crates/api-error",
    "network-policy",
    "service-mesh",
    "traffic-shaping",
    "dns-policy",
    "vm-firewall",
    "vpn-mesh",
    "packet-mirror",
    "nat-gateway",
    "net-monitor",
    "ova-tools",
    "secrets-manager",
    "zyvor-fabric-sdk",
    "billing",
    "compliance",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "Apache-2.0"
authors = ["zyvor-fabricd contributors"]

[workspace.dependencies]
tokio = { version = "1.44", features = ["full"] }
axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.5", features = ["derive"] }
toml = "1.1"
futures = "0.3"
uuid = { version = "1.16", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.11"
tar = "0.4"
flate2 = "1.1"
hostname = "0.4"
rand = "0.9"
zbus = { version = "4", default-features = false, features = ["tokio"] }
async-stream = "0.3"
async-trait = "0.1"
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
sha2 = "0.10"
hex = "0.4"
time = "0.3"
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }
base32 = "0.5"
quick-xml = "0.36"
