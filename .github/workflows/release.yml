name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2.1)"
        required: true

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: amd64
          # arm64: enable when cross toolchain is pinned in CI
          # - target: aarch64-unknown-linux-gnu
          #   arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev libclang-dev clang pkg-config libssl-dev

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: tools/fabric-doctor/go.mod

      - name: Build fabric-doctor
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then TAG="${{ inputs.tag }}"; fi
          make -C tools/fabric-doctor build VERSION="$TAG"
          cp tools/fabric-doctor/bin/fabric-doctor "$GITHUB_WORKSPACE/fabric-doctor"

      - name: Build binaries
        run: |
          cd backend
          cargo build --release --locked --bin zyvor-fabricd --bin zyvorctl
          cp target/release/zyvor-fabricd target/release/zyvorctl "$GITHUB_WORKSPACE/"

      - name: Package artifacts
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then TAG="${{ inputs.tag }}"; fi
          mkdir -p dist
          tar -czf "dist/zyvor-fabricd-${TAG}-linux-${{ matrix.arch }}.tar.gz" zyvor-fabricd zyvorctl fabric-doctor
          (cd dist && sha256sum *.tar.gz > "SHA256SUMS-${{ matrix.arch }}.txt")

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.arch }}
          path: dist/

  container:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  sbom-sign-release:
    runs-on: ubuntu-latest
    needs: [build, container]
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: "3.14.4"

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Assemble release assets
        id: assets
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then TAG="${{ inputs.tag }}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          mkdir -p release
          find artifacts -type f -name '*.tar.gz' -exec cp {} release/ \;
          find artifacts -type f -name 'SHA256SUMS*.txt' -exec cat {} \; > release/SHA256SUMS.txt
          helm package charts/zyvor-fabric -d release
          ls -la release/

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: release/sbom.spdx.json

      - name: Cosign sign (optional)
        continue-on-error: true
        env:
          COSIGN_YES: "true"
        run: |
          curl -sSfL https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64 -o cosign
          chmod +x cosign
          IMAGE="ghcr.io/${{ github.repository }}:${{ steps.assets.outputs.tag }}"
          # strip leading v for some tags
          ./cosign sign --yes "$IMAGE" || \
            ./cosign sign --yes "ghcr.io/${{ github.repository }}:latest" || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.assets.outputs.tag }}
          generate_release_notes: true
          files: |
            release/*
