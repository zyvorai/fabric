apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vmspawnd-operator.fullname" . }}
  labels:
    {{- include "vmspawnd-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "vmspawnd-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vmspawnd-operator.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "vmspawnd-operator.serviceAccountName" . }}
      containers:
      - name: operator
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
        - name: VMSPAWND_URL
          value: {{ .Values.vmspawnd.url | quote }}
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
