# Advisory/license/ban policy for cargo-deny.
# Exceptions go here with a short comment and issue link when needed.

[graph]
all-features = false
no-default-features = false

[advisories]
version = 2
yanked = "warn"
# First proven-infra land: warn so Dependabot/PRs can clear the baseline without
# blocking required CI. Tighten vulnerability back to "deny" once ignored set is empty.
unmaintained = "warn"
vulnerability = "warn"
ignore = [
    # Baseline tracked under #6 / Dependabot; ignore keeps room to re-deny later.
    { id = "RUSTSEC-2024-0436", reason = "transitive unmaintained; Dependabot follow-up" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error unmaintained transitive" },
    { id = "RUSTSEC-2024-0437", reason = "transitive; tracked for upgrade" },
    { id = "RUSTSEC-2026-0194", reason = "transitive; tracked for upgrade" },
    { id = "RUSTSEC-2026-0195", reason = "transitive; tracked for upgrade" },
    { id = "RUSTSEC-2025-0134", reason = "transitive unmaintained" },
    { id = "RUSTSEC-2023-0040", reason = "transitive unmaintained" },
    { id = "RUSTSEC-2025-0040", reason = "transitive; tracked for upgrade" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "OpenSSL",
    "CC0-1.0",
    "MPL-2.0",
    "0BSD",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-git = []
