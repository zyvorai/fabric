# FluxVM companion — mirrors docker-compose.yml fluxvm service.
# hostNetwork + privileged so KVM, cgroup host, and /run/netns work like compose.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluxvm
  namespace: zyvor-fabric
  labels:
    app: fluxvm
    app.kubernetes.io/name: zyvor-fabric
    app.kubernetes.io/component: fluxvm
spec:
  selector:
    matchLabels:
      app: fluxvm
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: fluxvm
        app.kubernetes.io/name: zyvor-fabric
        app.kubernetes.io/component: fluxvm
    spec:
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: fluxvm
        image: zyvor-fabric-fluxvm:local
        imagePullPolicy: IfNotPresent
        command: ["fluxvm", "serve"]
        ports:
        - name: api
          containerPort: 7788
          protocol: TCP
        securityContext:
          privileged: true
          capabilities:
            add:
              - NET_ADMIN
              - SYS_ADMIN
              - NET_BIND_SERVICE
              - NET_RAW
              - SYS_CHROOT
        volumeMounts:
        - name: fluxvm-data
          mountPath: /var/lib/fluxvm
        - name: fluxvm-run
          mountPath: /run/fluxvm
        - name: netns
          mountPath: /run/netns
        - name: kvm
          mountPath: /dev/kvm
        readinessProbe:
          tcpSocket:
            port: 7788
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          tcpSocket:
            port: 7788
          initialDelaySeconds: 15
          periodSeconds: 20
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 2Gi
      volumes:
      - name: fluxvm-data
        hostPath:
          path: /var/lib/fluxvm
          type: DirectoryOrCreate
      - name: fluxvm-run
        hostPath:
          path: /run/fluxvm
          type: DirectoryOrCreate
      - name: netns
        hostPath:
          path: /run/netns
          type: DirectoryOrCreate
      - name: kvm
        hostPath:
          path: /dev/kvm
          type: CharDevice
      tolerations:
      - operator: Exists
