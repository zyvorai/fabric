[package]
name = "machina-desktop"
version = "0.1.0"
description = "Machina — macOS workbench for Zyvor Fabric"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "machina_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
futures-util = "0.3"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
zyvor-fabric-sdk = { path = "../../../../backend/zyvor-fabric-sdk" }
vm-model = { path = "../../../../backend/vm-model" }
