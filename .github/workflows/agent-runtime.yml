name: Agent Runtime

on:
  push:
    branches: [main]
    paths:
      - "agent-runtime/**"
      - "sdk/agent-runtime/**"
      - "examples/agent-runtime/**"
      - ".github/workflows/agent-runtime.yml"
  pull_request:
    branches: [main]
    paths:
      - "agent-runtime/**"
      - "sdk/agent-runtime/**"
      - "examples/agent-runtime/**"
      - ".github/workflows/agent-runtime.yml"

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check
        run: cargo check --manifest-path agent-runtime/Cargo.toml --all-targets
      - name: Clippy
        run: cargo clippy --manifest-path agent-runtime/Cargo.toml --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path agent-runtime/Cargo.toml

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install SDK dependencies
        run: cd sdk/agent-runtime && npm install --no-audit --no-fund
      - name: SDK tests
        run: cd sdk/agent-runtime && npm test
      - name: SDK syntax
        run: cd sdk/agent-runtime && npm run lint
      - name: Package smoke
        run: cd sdk/agent-runtime && npm pack --dry-run
      - name: Guest worker syntax
        run: node --check agent-runtime/src/worker.mjs
      - name: TypeScript deploy smoke build
        run: |
          cd sdk/agent-runtime
          node --input-type=module - <<'NODE'
          import { build } from 'esbuild';
          const result = await build({
            entryPoints: ['../../examples/agent-runtime/agent.ts'],
            bundle: true,
            write: false,
            platform: 'node',
            format: 'esm',
            target: 'node20'
          });
          if (!result.outputFiles?.[0]?.contents?.length) process.exit(1);
          console.log(`bundle bytes=${result.outputFiles[0].contents.length}`);
          NODE
