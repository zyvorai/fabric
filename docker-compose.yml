services:
  zyvor-fabricd:
    build: .
    container_name: zyvor-fabricd
    ports:
      - "9080:8080"
    volumes:
      - zyvor-fabricd-data:/var/lib/zyvor-fabricd
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
      - MKNOD
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9095/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  zyvor-fabricd-data:
