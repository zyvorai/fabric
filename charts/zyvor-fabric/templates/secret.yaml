{{- if not .Values.security.existingSecret }}
{{- if eq (.Values.security.adminPassword | toString) "Admin@321" }}
{{- fail "security.adminPassword must not be Admin@321 (known default). Leave empty to generate a random password, or set a unique value. For convenient lab deploys use scripts with FABRIC_LAB_DEFAULTS=1 (kubectl Secret), not this Helm value." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zyvor-fabric.fullname" . }}-secrets
  labels:
    {{- include "zyvor-fabric.labels" . | nindent 4 }}
    app.kubernetes.io/component: credentials
type: Opaque
stringData:
  admin-username: {{ .Values.security.adminUsername | default "admin" | quote }}
  {{- if .Values.security.adminPassword }}
  admin-password: {{ .Values.security.adminPassword | quote }}
  {{- else }}
  admin-password: {{ randAlphaNum 24 | quote }}
  {{- end }}
  jwt-secret: {{ .Values.security.jwtSecret | default "zyvor-fabric-lab-jwt-change-me" | quote }}
{{- end }}
