# FluxVM companion — mirrors docker-compose.yml fluxvm service.
# hostNetwork + privileged so KVM, cgroup host, and /run/netns work like compose.
# Network Fabric v3: bpffs + SYS_RESOURCE (memlock) + fluxvm-dataplane.toml.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluxvm
  namespace: zyvor-fabric
  labels:
    app: fluxvm
    app.kubernetes.io/name: zyvor-fabric
    app.kubernetes.io/component: fluxvm
spec:
  selector:
    matchLabels:
      app: fluxvm
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: fluxvm
        app.kubernetes.io/name: zyvor-fabric
        app.kubernetes.io/component: fluxvm
    spec:
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: fluxvm
        image: zyvor-fabric-fluxvm:local
        imagePullPolicy: IfNotPresent
        command: ["fluxvm", "--config", "/etc/fluxvm.toml", "serve"]
        ports:
        - name: api
          containerPort: 7788
          protocol: TCP
        securityContext:
          privileged: true
          capabilities:
            add:
              - NET_ADMIN
              - SYS_ADMIN
              - SYS_RESOURCE
              - NET_BIND_SERVICE
              - NET_RAW
              - SYS_CHROOT
        volumeMounts:
        - name: fluxvm-data
          mountPath: /var/lib/fluxvm
        - name: fluxvm-run
          mountPath: /run/fluxvm
        - name: netns
          mountPath: /run/netns
        - name: bpffs
          mountPath: /sys/fs/bpf
        - name: fluxvm-config
          mountPath: /etc/fluxvm.toml
          subPath: fluxvm.toml
          readOnly: true
        - name: kvm
          mountPath: /dev/kvm
        readinessProbe:
          tcpSocket:
            port: 7788
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          tcpSocket:
            port: 7788
          initialDelaySeconds: 15
          periodSeconds: 20
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 2Gi
      volumes:
      - name: fluxvm-data
        hostPath:
          path: /var/lib/fluxvm
          type: DirectoryOrCreate
      - name: fluxvm-run
        hostPath:
          path: /run/fluxvm
          type: DirectoryOrCreate
      - name: netns
        hostPath:
          path: /run/netns
          type: DirectoryOrCreate
      - name: bpffs
        hostPath:
          path: /sys/fs/bpf
          type: DirectoryOrCreate
      - name: fluxvm-config
        configMap:
          name: fluxvm-config
      - name: kvm
        hostPath:
          path: /dev/kvm
          type: CharDevice
      tolerations:
      - operator: Exists
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluxvm-config
  namespace: zyvor-fabric
  labels:
    app: fluxvm
    app.kubernetes.io/name: zyvor-fabric
    app.kubernetes.io/component: fluxvm
data:
  fluxvm.toml: |
    # Network Fabric v3 — keep required=false until first green attach.
    [sandbox.dataplane]
    mode = "ebpf"
    bpf_object = "/usr/lib/fluxvm/bpf/fluxvm_tc.bpf.o"
    pin_root = "/sys/fs/bpf/fluxvm"
    required = false
