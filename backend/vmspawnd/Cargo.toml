[package]
name = "vmspawnd"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "vmspawnd"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
axum = { workspace = true, features = ["ws"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
toml.workspace = true
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors"] }
futures.workspace = true
uuid.workspace = true
chrono.workspace = true
reqwest = { version = "0.12", features = ["json"] }

vm-model = { path = "../vm-model" }
state-store = { path = "../state-store" }
vmspawn-driver = { path = "../vmspawn-driver" }
systemd-driver = { path = "../systemd-driver" }
vnc-proxy = { path = "../vnc-proxy" }
cloud-init = { path = "../cloud-init" }
tpm-support = { path = "../tpm-support" }
prometheus-exporter = { path = "../prometheus-exporter" }
vmspawnd-storage = { path = "../crates/storage" }
vmspawnd-system = { path = "../crates/system" }
vmspawnd-vm = { path = "../crates/vm" }
