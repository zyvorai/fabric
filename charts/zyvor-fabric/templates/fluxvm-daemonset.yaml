{{- if .Values.fluxvm.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "zyvor-fabric.fullname" . }}-fluxvm
  labels:
    {{- include "zyvor-fabric.labels" . | nindent 4 }}
    app.kubernetes.io/component: fluxvm
    app: fluxvm
spec:
  selector:
    matchLabels:
      {{- include "zyvor-fabric.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: fluxvm
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "zyvor-fabric.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: fluxvm
        app: fluxvm
    spec:
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: fluxvm
        image: {{ include "zyvor-fabric.image" (dict "registry" .Values.global.imageRegistry "repository" .Values.fluxvm.image.repository "tag" .Values.fluxvm.image.tag) }}
        imagePullPolicy: {{ .Values.fluxvm.image.pullPolicy }}
        command: ["fluxvm", "serve"]
        ports:
        - name: api
          containerPort: 7788
          protocol: TCP
        securityContext:
          privileged: true
          capabilities:
            add:
              - NET_ADMIN
              - SYS_ADMIN
              - NET_BIND_SERVICE
              - NET_RAW
              - SYS_CHROOT
        volumeMounts:
        - name: fluxvm-data
          mountPath: /var/lib/fluxvm
        - name: fluxvm-run
          mountPath: /run/fluxvm
        - name: netns
          mountPath: /run/netns
        - name: kvm
          mountPath: /dev/kvm
        readinessProbe:
          tcpSocket:
            port: 7788
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          tcpSocket:
            port: 7788
          initialDelaySeconds: 15
          periodSeconds: 20
          failureThreshold: 3
        resources:
          {{- toYaml .Values.fluxvm.resources | nindent 10 }}
      volumes:
      - name: fluxvm-data
        hostPath:
          path: {{ .Values.fluxvm.hostPath }}
          type: DirectoryOrCreate
      - name: fluxvm-run
        hostPath:
          path: {{ .Values.fluxvm.runPath }}
          type: DirectoryOrCreate
      - name: netns
        hostPath:
          path: /run/netns
          type: DirectoryOrCreate
      - name: kvm
        hostPath:
          path: /dev/kvm
          type: CharDevice
      tolerations:
      - operator: Exists
{{- end }}
