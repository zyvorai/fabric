# Lab / first-install credentials for Zyvor Fabric on Kubernetes.
# Auth is sourced from this Secret via env (not systemd .admin_password files).
#
# Defaults for new deployments:
#   username: admin
#   password: Admin@321
#
# Rotate (lab):
#   kubectl create secret generic zyvor-fabric-secrets \
#     --from-literal=admin-username=admin \
#     --from-literal=admin-password='NEW_PASSWORD' \
#     --from-literal=jwt-secret="$(openssl rand -base64 32)" \
#     -n zyvor-fabric --dry-run=client -o yaml | kubectl apply -f -
#   kubectl -n zyvor-fabric rollout restart daemonset/zyvor-fabricd
#
# Note: admin password is seeded only when auth.db has zero users. To re-seed
# after a password change, remove the hostPath auth DB (lab only):
#   sudo rm -f /var/lib/zyvor-fabricd/auth.db
# then restart the DaemonSet.
apiVersion: v1
kind: Secret
metadata:
  name: zyvor-fabric-secrets
  namespace: zyvor-fabric
  labels:
    app: zyvor-fabric
    app.kubernetes.io/name: zyvor-fabric
    app.kubernetes.io/component: credentials
type: Opaque
stringData:
  admin-username: "admin"
  admin-password: "Admin@321"
  # Lab JWT — replace in real environments (openssl rand -base64 32).
  jwt-secret: "zyvor-fabric-lab-jwt-change-me"
