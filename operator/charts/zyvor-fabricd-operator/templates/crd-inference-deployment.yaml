# InferenceDeployment CRD — Fabric AI Workloads (preview).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: inferencedeployments.zyvor-fabricd.io
  labels:
    {{- include "zyvor-fabricd-operator.labels" . | nindent 4 }}
spec:
  group: zyvor-fabricd.io
  names:
    kind: InferenceDeployment
    listKind: InferenceDeploymentList
    plural: inferencedeployments
    shortNames: [infdep]
    singular: inferencedeployment
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [model, profile]
              properties:
                model:
                  type: string
                  description: ModelArtifact name registered in fabricd
                profile:
                  type: string
                  description: InferenceProfile name registered in fabricd
                replicas:
                  type: integer
                  minimum: 0
                tenant:
                  type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                message:
                  type: string
                ready_replicas:
                  type: integer
