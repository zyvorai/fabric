components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    VmName:
      name: name
      in: path
      required: true
      schema:
        type: string
    LogLines:
      name: lines
      in: query
      schema:
        type: integer
        default: 100
        maximum: 1000
    LogPriority:
      name: priority
      in: query
      schema:
        type: integer
        minimum: 0
        maximum: 7
    LogGrep:
      name: grep
      in: query
      schema:
        type: string

  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
        totp_code:
          type: string
          nullable: true

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        user_id:
          type: string
        role:
          type: string
        username:
          type: string

    MeResponse:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        role:
          type: string

    LogEntry:
      type: object
      properties:
        timestamp:
          type: string
        hostname:
          type: string
        unit:
          type: string
        message:
          type: string
        priority:
          type: string

    LogResponse:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/LogEntry'
        count:
          type: integer

    VMEvent:
      type: object
      properties:
        id:
          type: string
        event_type:
          type: string
          enum:
            - created
            - started
            - stopped
            - paused
            - resumed
            - deleted
            - cloned
            - migrated
            - snapshot_created
            - snapshot_reverted
            - error
            - auto_healed
        vm_name:
          type: string
        detail:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time

    VMListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VM'
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer

    VM:
      type: object
      properties:
        name:
          type: string
        state:
          type: string
          enum: [running, stopped, paused, unknown]
        cpus:
          type: integer
        memory:
          type: integer
          description: Memory in MB
        image:
          type: string
        ip:
          type: string
          nullable: true
        pid:
          type: integer
          nullable: true

    CreateVMRequest:
      type: object
      required:
        - name
        - image
      properties:
        name:
          type: string
        image:
          type: string
        cpus:
          type: integer
          default: 2
        memory:
          type: integer
          default: 2048
          description: Memory in MB

    VMMetrics:
      type: object
      properties:
        cpu_usage:
          type: number
          format: double
        memory_usage:
          type: integer
        disk_usage:
          type: integer
        network_rx:
          type: integer
        network_tx:
          type: integer

    CloudInitConfig:
      type: object
      required:
        - instance_id
        - hostname
      properties:
        instance_id:
          type: string
        hostname:
          type: string
        user_data:
          type: string
          nullable: true
        meta_data:
          type: object
          nullable: true
        network_config:
          type: object
          nullable: true

security:
  - bearerAuth: []
