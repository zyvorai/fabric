<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fabric share card (dark)</title>
<!--
  1200x630 card: README hero and website Open Graph (website/static/img/social-card.png).
  Dark twin of fabric-share-card.html, used by the README <picture> for dark themes (not the website OG).
  Palette: #000 / #0b0b0f, text #f5f5f7, cards #1d1d1f, blue #2997ff.
  Orange appears once, as the dot on the AI node.
  Build:  ./docs/social/build-social-card.sh
-->
<style>
  :root {
    --bg: #000000;
    --wash: #0b0b0f;
    --ink: #f5f5f7;
    --soft: #a1a1a6;
    --hair: #2c2c2e;
    --blue: #0a84ff;
    --blue2: #2997ff;
    --deep: #64b0ff;
    --pill-bg: #0d2238;
    --pill-line: #1c3d63;
    --node-fill: #ffffff;
    --node-line: #c7d9ef;
    --hub-fill: #ffffff;
    --hub-line: #cfe2f8;
    --glow: rgba(41, 151, 255, 0.20);
    --sans: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --mono: 'SF Mono', Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--bg); }
  .card {
    position: relative; width: 1200px; height: 630px;
    background:
      radial-gradient(520px 460px at 900px 315px, var(--glow), rgba(41, 151, 255, 0.05) 60%, rgba(41, 151, 255, 0) 100%),
      linear-gradient(180deg, var(--bg) 0%, var(--wash) 100%);
    color: var(--ink); font-family: var(--sans);
  }
  .left { position: absolute; left: 72px; top: 0; width: 580px; height: 100%; }
  .eyebrow {
    position: absolute; top: 92px;
    font-family: var(--mono); font-weight: 500; font-size: 15px;
    letter-spacing: 0.22em; color: var(--deep); text-transform: uppercase;
  }
  h1 {
    position: absolute; top: 122px;
    font-size: 116px; line-height: 1.02; font-weight: 700; letter-spacing: -0.04em;
  }
  .tag {
    position: absolute; top: 272px; width: 540px;
    font-size: 24px; line-height: 1.42; font-weight: 400; color: var(--soft);
  }
  .pills { position: absolute; top: 410px; display: flex; flex-wrap: wrap; gap: 9px; width: 560px; }
  .pill {
    font-family: var(--mono); font-weight: 700; font-size: 12px;
    letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap;
    padding: 9px 13px; border-radius: 999px;
    background: var(--pill-bg); color: var(--deep); border: 1px solid var(--pill-line);
  }
  .pill.s { background: var(--blue); color: #fff; border-color: var(--blue); }
  .foot {
    position: absolute; top: 556px; width: 540px; padding-top: 14px; border-top: 1px solid var(--hair);
    font-family: var(--mono); font-size: 14px; color: var(--soft); letter-spacing: 0.02em;
  }
  .foot b { color: var(--ink); font-weight: 700; }
  svg.art { position: absolute; left: 600px; top: 0; }
  svg.art text {
    font-family: var(--mono); font-weight: 700; font-size: 13px;
    letter-spacing: 0.14em; fill: var(--soft);
  }
</style>
</head>
<body>
<div class="card">
  <div class="left">
    <div class="eyebrow">Private cloud control plane</div>
    <h1>Fabric</h1>
    <p class="tag">VMs, networking, storage, security, and AI inference from one daemon — CLI, Web, Kubernetes, and Terraform.</p>
    <div class="pills">
      <span class="pill s">Single daemon</span>
      <span class="pill s">Kubernetes-ready</span>
      <span class="pill">FluxVM + GuestKit</span>
      <span class="pill">Apache-2.0</span>
    </div>
    <div class="foot">github.com/zyvorai/fabric &nbsp;·&nbsp; <b>v0.3.0</b></div>
  </div>

  <svg class="art" width="600" height="630" viewBox="0 0 600 630" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="hex" x1="268" y1="278" x2="332" y2="352" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#2997ff"/><stop offset="1" stop-color="#64b0ff"/>
      </linearGradient>
      <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
        <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000000" flood-opacity="0.55"/>
      </filter>
      <filter id="shadow-s" x="-60%" y="-60%" width="220%" height="240%">
        <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.55"/>
      </filter>
    </defs>
    <g id="spokes" stroke="#2997ff" stroke-opacity=".6" stroke-width="1.8" stroke-linecap="round"></g>
    <circle cx="300" cy="315" r="76" fill="#1d1d1f" stroke="#2f4a6b" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="300" cy="315" r="52" fill="none" stroke="#2997ff" stroke-opacity=".35" stroke-width="2"/>
    <polygon points="300,278 332,296 332,334 300,352 268,334 268,296"
      fill="none" stroke="url(#hex)" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="300" cy="315" r="10" fill="url(#hex)"/>
    <g id="dots"></g>
    <g id="labels"></g>
  </svg>
</div>
<script>
  const NS = 'http://www.w3.org/2000/svg';
  const cx = 300, cy = 315;
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e);
    return e;
  };
  const pt = (deg, r) => [cx + r * Math.cos(deg * Math.PI / 180), cy + r * Math.sin(deg * Math.PI / 180)];

  const nodes = [
    { label: 'VM', deg: -90 },
    { label: 'NET', deg: -30 },
    { label: 'STORAGE', deg: 30 },
    { label: 'SECURITY', deg: 90 },
    { label: 'AI', deg: 150, hot: true },
    { label: 'K8S', deg: 210 },
  ];
  const spokes = document.getElementById('spokes');
  const dots = document.getElementById('dots');
  const labels = document.getElementById('labels');
  for (const n of nodes) {
    const [x1, y1] = pt(n.deg, 80);
    const [x2, y2] = pt(n.deg, 166);
    el('line', { x1, y1, x2, y2 }, spokes);
    el('circle', { cx: x2, cy: y2, r: 12, fill: '#1d1d1f', stroke: '#33507a', 'stroke-width': 1.5, filter: 'url(#shadow-s)' }, dots);
    el('circle', { cx: x2, cy: y2, r: 4.5, fill: n.hot ? '#ff6a2a' : '#2997ff' }, dots);
    // Side nodes get their label beside the node, top/bottom nodes above/below it.
    const c = Math.cos(n.deg * Math.PI / 180);
    let tx, ty, anchor;
    if (c > 0.3) { tx = x2 + 22; ty = y2; anchor = 'start'; }
    else if (c < -0.3) { tx = x2 - 22; ty = y2; anchor = 'end'; }
    else { [tx, ty] = pt(n.deg, 200); anchor = 'middle'; }
    const t = el('text', { x: tx, y: ty, 'text-anchor': anchor, 'dominant-baseline': 'middle' }, labels);
    t.textContent = n.label;
  }
</script>
</body>
</html>
