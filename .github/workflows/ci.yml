name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev libclang-dev clang pkg-config libssl-dev

      - name: Check formatting
        run: cd backend && cargo fmt -- --check

      - name: Lint
        run: cd backend && cargo clippy -- -D warnings

      - name: Test
        run: cd backend && cargo test

      - name: Build
        run: cd backend && cargo build --release

  coverage-rust:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev libclang-dev clang pkg-config libssl-dev
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: cargo llvm-cov (informational)
        run: |
          cd backend
          cargo llvm-cov --workspace --lcov --output-path lcov.info || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-lcov
          path: backend/lcov.info
          if-no-files-found: ignore

  api-audit:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev libclang-dev clang pkg-config libssl-dev

      - name: UX API audit smoke test
        run: ./scripts/ci-api-audit.sh

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: cd web && npm ci

      - name: Lint
        run: cd web && npm run lint

      - name: Typecheck
        run: cd web && npm run typecheck

      - name: Test
        run: cd web && npm test

      - name: Coverage (informational)
        continue-on-error: true
        run: cd web && npm run test:coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-coverage
          path: web/coverage
          if-no-files-found: ignore

      - name: Build
        run: cd web && npm run build

  docs-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate project stats
        run: ./scripts/generate-project-stats.sh
      - name: Fail if stats drifted
        run: git diff --exit-code -- docs/generated/project-stats.md
