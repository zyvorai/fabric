[daemon]
# Listen address for REST API
listen = "127.0.0.1:9095"
# CORS allowed origins (default: ["http://127.0.0.1:9095"])
# cors_origins = ["http://127.0.0.1:9095", "https://myhost.example.com"]

[storage]
# Path to store VM state
path = "/var/lib/zyvor-fabricd"
# Path to store VM images
image_path = "/var/lib/zyvor-fabricd/images"

[backup]
# Backup storage directory
backup_dir = "/var/lib/zyvor-fabricd/backups"
# Days to retain backups before automatic cleanup (default: 7)
# retention_days = 7
# Default backup type: "full" or "incremental" (default: "full")
# backup_type = "full"

[network]
# Default network bridge
bridge = "br0"

[driver]
# VM lifecycle driver backend: "machinectl" (default, systemd-machined/D-Bus)
# or "ephemera" (see the systemd-removal migration plan — opt-in until the
# lifecycle cutover has soaked in staging). Log streaming and cgroup v2
# resource control (CPU/memory/IO/pids/cpuset limits) both work on the
# "ephemera" backend today; true vCPU-thread pinning and hotplug (resizing
# a running VM) still require "machinectl". As of Ephemera v0.1.0, its
# newer per-VM storage backends (LVM thin/NBD/Ceph RBD) and network
# namespaces aren't yet reachable through this driver either — every VM
# still gets Ephemera's default qcow2/raw storage and shared-bridge
# networking (see ephemera-client's crate doc comment for the full gap
# list).
# backend = "machinectl"
# Ephemera's REST API base URL. Only consulted when backend = "ephemera".
# ephemera_url = "http://127.0.0.1:7788"
# Bearer token for Ephemera's auth layer, if it has auth.tokens configured.
# ephemera_token = "..."

[auth]
# Enable JWT-based authentication (default: true)
enabled = true
# JWT signing secret: auto-generated and persisted to /var/lib/zyvor-fabricd/.jwt_secret
# if not set here or via ZYVOR_FABRICD_JWT_SECRET env var.
# jwt_secret = "..."
# SQLite user database path
# db_path = "/var/lib/zyvor-fabricd/auth.db"
# Token lifetime in hours (default: 24)
# token_expiration_hours = 24
# Admin password: auto-generated and written to /var/lib/zyvor-fabricd/.admin_password
# if not set here or via ZYVOR_FABRICD_ADMIN_PASSWORD env var. Only used on first startup.
# default_admin_password = "..."
