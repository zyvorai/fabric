apiVersion: v1
kind: Namespace
metadata:
  name: zyvor-fabric
  labels:
    app: zyvor-fabric
    # Privileged PSS required: hostNetwork, KVM, nftables/rtnetlink (same as docker-compose).
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
