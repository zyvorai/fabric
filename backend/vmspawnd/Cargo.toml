[package]
name = "vmspawnd"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "vmspawnd"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
axum = { workspace = true, features = ["ws"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
toml.workspace = true
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors"] }
futures.workspace = true
uuid.workspace = true
chrono.workspace = true
reqwest = { version = "0.12", features = ["json"] }
lettre = { version = "0.11", features = ["tokio1-native-tls", "smtp-transport", "builder"] }
rand.workspace = true
async-stream = "0.3"
tokio-stream = "0.1"

networking = { path = "../networking" }
vm-model = { path = "../vm-model" }
security = { path = "../security" }
state-store = { path = "../state-store" }
vmspawn-driver = { path = "../vmspawn-driver" }
vnc-proxy = { path = "../vnc-proxy" }
cloud-init = { path = "../cloud-init" }
tpm-support = { path = "../tpm-support" }
prometheus-exporter = { path = "../prometheus-exporter" }
vmspawnd-driver-core = { path = "../crates/driver-core" }
vmspawnd-machinectl-driver = { path = "../crates/machinectl-driver" }
vmspawnd-storage = { path = "../crates/storage" }
vmspawnd-system = { path = "../crates/system" }
vmspawnd-vm = { path = "../crates/vm" }
datacenter = { path = "../datacenter" }
resource-pools = { path = "../resource-pools" }
predictive-drs = { path = "../predictive-drs" }
distributed-storage = { path = "../distributed-storage" }
encryption = { path = "../encryption" }

migration = { path = "../migration" }
fault-tolerance = { path = "../fault-tolerance" }
replication = { path = "../replication" }
site-recovery = { path = "../site-recovery" }
content-library = { path = "../content-library" }
lifecycle-manager = { path = "../lifecycle-manager" }
certificate-manager = { path = "../certificate-manager" }
