name: Operator

on:
  push:
    paths:
      - "operator/**"
  pull_request:
    paths:
      - "operator/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: azure/setup-helm@v4
        with:
          version: "3.14.4"
      - name: Cargo test
        run: cd operator && cargo test
      - name: Helm template lint
        run: |
          helm template test operator/charts/vmspawnd-operator > /tmp/operator.yaml
          grep -q 'VMSPAWND_URL' /tmp/operator.yaml
