name: Keep

# Keep product surface: unit tests + real end-to-end against a live agent-runtime
# and FluxVM sandbox stub (no /dev/kvm). Also runs the agent-runtime control-plane
# e2e (proxy, Sentinel, DLP, approvals).

on:
  workflow_dispatch:
  push:
    branches: [main, "feat/**"]
    paths:
      - "agent-runtime/**"
      - "docs/keep/**"
      - "scripts/keepctl"
      - "scripts/keep-demo.sh"
      - "scripts/keep-demo-pdf.sh"
      - "sdk/agent-runtime/**"
      - "reference/vendor-gateway/**"
      - "scripts/keep-bench.sh"
      - "scripts/keep-live-scenarios.sh"
      - "scripts/keep-bake-node22-agent.sh"
      - "examples/keep-agents/**"
      - "scripts/keep-e2e.sh"
      - "scripts/keep-bake-browser-agent.sh"
      - "scripts/keep-bake-browser-smoke.sh"
      - "docs/tutorials/16-keep-workstation.md"
      - ".github/workflows/keep.yml"
  pull_request:
    paths:
      - "agent-runtime/**"
      - "docs/keep/**"
      - "scripts/keepctl"
      - "scripts/keep-demo.sh"
      - "scripts/keep-demo-pdf.sh"
      - "sdk/agent-runtime/**"
      - "reference/vendor-gateway/**"
      - "scripts/keep-bench.sh"
      - "scripts/keep-live-scenarios.sh"
      - "scripts/keep-bake-node22-agent.sh"
      - "examples/keep-agents/**"
      - "scripts/keep-e2e.sh"
      - "scripts/keep-bake-browser-agent.sh"
      - "scripts/keep-bake-browser-smoke.sh"
      - "docs/tutorials/16-keep-workstation.md"
      - ".github/workflows/keep.yml"

jobs:
  keep-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent-runtime
      - name: Check formatting
        run: cargo fmt --manifest-path agent-runtime/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path agent-runtime/Cargo.toml --all-targets --examples -- -D warnings
      - name: Keep / policy / credentials / export tests
        run: |
          cargo test --manifest-path agent-runtime/Cargo.toml policy -- --nocapture
          cargo test --manifest-path agent-runtime/Cargo.toml export_tokens -- --nocapture
          cargo test --manifest-path agent-runtime/Cargo.toml credentials -- --nocapture
          cargo test --manifest-path agent-runtime/Cargo.toml notify -- --nocapture
          cargo test --manifest-path agent-runtime/Cargo.toml --lib

  keep-demos-e2e:
    # The one-click demos, a user-defined use case, and a signed pack deploy in
    # Keep mode, against the real runtime binary and the FluxVM stand-in.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent-runtime
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install poppler and tesseract (the PDF and photo demos)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr python3-pil
      - name: Build the runtime and install the SDK
        run: |
          cargo build --manifest-path agent-runtime/Cargo.toml
          npm ci --prefix sdk/agent-runtime --no-audit --no-fund
      - name: SDK tests (pack composition, signing, phone client, model socket)
        run: npm test --prefix sdk/agent-runtime
      - name: Vendor gateway tests
        run: npm test --prefix reference/vendor-gateway
      - name: Demos, custom use cases and signed packs
        run: bash agent-runtime/tests/demos-ci.sh

  keep-browser-bake-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: browser-agent template smoke (no KVM)
        run: |
          chmod +x scripts/keep-bake-browser-smoke.sh
          ./scripts/keep-bake-browser-smoke.sh

  keep-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent-runtime
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Build agent-runtime + signer
        run: |
          cargo build --manifest-path agent-runtime/Cargo.toml
          cargo build --manifest-path agent-runtime/Cargo.toml --example keep_sign_policy
      - name: Keep end-to-end (runtime + FluxVM stub + keepctl)
        run: |
          chmod +x scripts/keepctl scripts/keep-e2e.sh
          ./scripts/keep-e2e.sh
      - name: Runtime control-plane e2e (proxy / Sentinel / DLP / approvals)
        run: |
          cargo build --manifest-path agent-runtime/Cargo.toml --release
          BIN=agent-runtime/target/release/zyvor-fabric-agent-runtime \
            bash agent-runtime/scripts/e2e-no-fluxvm.sh
      - name: keepctl CLI surface
        run: |
          scripts/keepctl --help | grep -q policy
          scripts/keepctl --help | grep -q pack
          scripts/keepctl --help | grep -q export-token
      - name: Docs present
        run: |
          test -f docs/keep/KEEP.md
          test -f docs/keep/KEEP-0.2.md
          test -f docs/keep/PRODUCTION.md
          test -f docs/keep/sentinel/keep.policy.yaml
          test -f docs/tutorials/16-keep-workstation.md
          test -f scripts/keep-e2e.sh
          test -f agent-runtime/examples/keep_sign_policy.rs
          test -f docs/keep/VENDORS.md
          test -f docs/keep/TENANCY.md
          test -f docs/keep/mobile/test-vectors.json
          test -f agent-runtime/templates/node22-agent/build.json
      - name: How to re-run locally
        if: always()
        run: |
          cat <<'EOF'
          Locally (full Keep e2e, no KVM):
            ./scripts/keep-e2e.sh
            BIN=agent-runtime/target/release/zyvor-fabric-agent-runtime \
              ./agent-runtime/scripts/e2e-no-fluxvm.sh

          Against a live FluxVM lab:
            KEEP_E2E_FLUXVM=1 ZYVOR_AGENT_FLUXVM_URL=http://127.0.0.1:7788 ./scripts/keep-e2e.sh

          Production knobs:
            ZYVOR_AGENT_POLICY_TRUSTED_SIGNERS=<hex32 pubkeys>
            ZYVOR_AGENT_POLICY_REQUIRE_SIGNATURE=1
            X-Keep-Export-Token for GET /v1/export/audit and GET /v1/agents/{name}/pack

          Tutorial: docs/tutorials/16-keep-workstation.md
          Honesty: measured = software-test; TEE host-memory = Keep 0.2 + hardware only.
          EOF
