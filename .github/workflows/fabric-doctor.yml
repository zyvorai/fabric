name: Fabric Doctor

on:
  push:
    branches: [main]
    paths:
      - 'tools/fabric-doctor/**'
      - '.github/workflows/fabric-doctor.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/fabric-doctor/**'
      - '.github/workflows/fabric-doctor.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/fabric-doctor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: tools/fabric-doctor/go.mod

      - name: Formatting
        run: test -z "$(gofmt -l ./cmd ./internal)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o bin/fabric-doctor ./cmd/fabric-doctor

      - name: Smoke test
        run: ./bin/fabric-doctor check --output json --skip-service-ping || test $? -eq 1

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    defaults:
      run:
        working-directory: tools/fabric-doctor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: tools/fabric-doctor/go.mod
      - name: Cross-build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -o "bin/fabric-doctor-${GOOS}-${GOARCH}" ./cmd/fabric-doctor
