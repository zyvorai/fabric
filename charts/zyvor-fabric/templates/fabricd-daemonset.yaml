{{- if .Values.fabricd.enabled }}
{{- $secretName := .Values.security.existingSecret | default (printf "%s-secrets" (include "zyvor-fabric.fullname" .)) }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "zyvor-fabric.fullname" . }}-fabricd
  labels:
    {{- include "zyvor-fabric.labels" . | nindent 4 }}
    app.kubernetes.io/component: fabricd
    app: zyvor-fabricd
spec:
  selector:
    matchLabels:
      {{- include "zyvor-fabric.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: fabricd
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "zyvor-fabric.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: fabricd
        app: zyvor-fabricd
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: zyvor-fabricd
        image: {{ include "zyvor-fabric.image" (dict "registry" .Values.global.imageRegistry "repository" .Values.fabricd.image.repository "tag" .Values.fabricd.image.tag) }}
        imagePullPolicy: {{ .Values.fabricd.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 9095
          protocol: TCP
        env:
        - name: ZYVOR_FABRICD_LISTEN
          value: {{ .Values.fabricd.listen | quote }}
        - name: ZYVOR_FABRICD_CONFIG
          value: "/etc/zyvor-fabricd/zyvor-fabricd.toml"
        - name: ZYVOR_FABRICD_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ $secretName }}
              key: admin-password
        - name: ZYVOR_FABRICD_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ $secretName }}
              key: jwt-secret
        - name: ZYVOR_FABRICD_LOG_LEVEL
          value: {{ .Values.fabricd.logLevel | quote }}
        securityContext:
          privileged: true
          capabilities:
            add:
              - NET_ADMIN
              - SYS_ADMIN
              - NET_RAW
              - MKNOD
              - SYS_PTRACE
              - NET_BIND_SERVICE
              - SETUID
              - SETGID
              - SYS_CHROOT
        volumeMounts:
        - name: data
          mountPath: /var/lib/zyvor-fabricd
        - name: config
          mountPath: /etc/zyvor-fabricd/zyvor-fabricd.toml
          subPath: zyvor-fabricd.toml
          readOnly: true
        livenessProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 20
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 6
        resources:
          {{- toYaml .Values.fabricd.resources | nindent 10 }}
      volumes:
      - name: data
        hostPath:
          path: {{ .Values.fabricd.hostPath }}
          type: DirectoryOrCreate
      - name: config
        configMap:
          name: {{ include "zyvor-fabric.fullname" . }}-config
      tolerations:
      - operator: Exists
{{- end }}
