[workspace]
resolver = "2"
members = [
    "vmspawnd",
    "vmctl",
    "vmctl-tui",
    "vmspawn-driver",
    "systemd-driver",
    "vm-model",
    "state-store",
    "vnc-proxy",
    "cloud-init",
    "tpm-support",
    "prometheus-exporter",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["vmspawnd contributors"]

[workspace.dependencies]
tokio = { version = "1.41", features = ["full"] }
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
tui-input = "0.10"
toml = "0.8"
futures = "0.3"
